<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="50%" stop-color="#34a853"/>
      <stop offset="100%" stop-color="#fbbc05"/>
    </linearGradient>
    <linearGradient id="crmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a1e0"/>
      <stop offset="100%" stop-color="#0176d3"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect x="5" y="5" width="840" height="410" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Architecture Title -->
  <text x="425" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">🏗️ System Architecture &amp; Data Pipeline</text>
  <text x="425" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">End-to-End Multimodal Vision Processing inside Salesforce Core Architecture</text>

  <!-- Column 1: Client Layer (Left) -->
  <g transform="translate(35, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="280" rx="12" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="45" rx="12" fill="url(#clientGrad)"/>
    <rect x="0" y="30" width="220" height="15" fill="url(#clientGrad)"/>
    <text x="110" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1. CLIENT LAYER</text>

    <!-- Component 1 -->
    <rect x="15" y="60" width="190" height="50" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="110" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">📱 Salesforce Mobile App</text>
    <text x="110" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">iOS &amp; Android Camera Capture</text>

    <!-- Component 2 -->
    <rect x="15" y="125" width="190" height="50" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="110" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">💻 Desktop Lightning UI</text>
    <text x="110" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Webcam / Gallery Image Upload</text>

    <!-- Component 3 -->
    <rect x="15" y="190" width="190" height="65" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="110" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0284c7" text-anchor="middle">⚡ LWC Pre-Processor</text>
    <text x="110" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#0369a1" text-anchor="middle">• Client-side EXIF Auto-Rotation</text>
    <text x="110" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#0369a1" text-anchor="middle">• Canvas Compression (&lt;900 KB)</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(265, 220)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4 3"/>
    <polygon points="35,-5 45,0 35,5" fill="#0284c7"/>
    <text x="22" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">Base64</text>
  </g>

  <!-- Column 2: Apex Core & Security (Middle) -->
  <g transform="translate(315, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="240" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="45" rx="12" fill="url(#coreGrad)"/>
    <rect x="0" y="30" width="240" height="15" fill="url(#coreGrad)"/>
    <text x="120" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2. APEX CONTROLLER</text>

    <!-- Component 1 -->
    <rect x="15" y="60" width="210" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="120" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">🔒 checkLicenseAccess()</text>
    <text x="120" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">7-Day Window • 2-User Cap Registry</text>

    <!-- Component 2 -->
    <rect x="15" y="125" width="210" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="120" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">🔑 Key Vault (Custom Settings)</text>
    <text x="120" y="161" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Server-Side Gemini API Key Storage</text>

    <!-- Component 3 -->
    <rect x="15" y="190" width="210" height="65" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="120" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#1e293b" text-anchor="middle">⚙️ Callout &amp; DML Router</text>
    <text x="120" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">• REST Callout to Gemini Vision</text>
    <text x="120" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">• DML INSERT WITH USER_MODE</text>
  </g>

  <!-- Arrow 2 -> 3 Top: Outbound to Gemini -->
  <g transform="translate(565, 140)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#4285f4" stroke-width="2.5"/>
    <polygon points="35,-5 45,0 35,5" fill="#4285f4"/>
    <text x="22" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#4285f4" text-anchor="middle">HTTPS</text>
  </g>

  <!-- Arrow 2 -> 4 Bottom: Inbound DML to CRM -->
  <g transform="translate(565, 290)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#00a1e0" stroke-width="2.5"/>
    <polygon points="35,-5 45,0 35,5" fill="#00a1e0"/>
    <text x="22" y="-8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#00a1e0" text-anchor="middle">DML</text>
  </g>

  <!-- Column 3 Top: Google Gemini AI (Right Top) -->
  <g transform="translate(620, 90)" filter="url(#shadow)">
    <rect x="0" y="0" width="195" height="120" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="35" rx="12" fill="#4285f4"/>
    <rect x="0" y="25" width="195" height="10" fill="#4285f4"/>
    <text x="97" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">3. GOOGLE GEMINI AI</text>

    <text x="97" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">Gemini 1.5 / 2.0 Flash</text>
    <text x="97" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">• Multimodal Visual OCR</text>
    <text x="97" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">• 100+ Global Languages</text>
    <text x="97" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">• Structured JSON Return</text>
  </g>

  <!-- Column 3 Bottom: Salesforce CRM (Right Bottom) -->
  <g transform="translate(620, 230)" filter="url(#shadow)">
    <rect x="0" y="0" width="195" height="140" rx="12" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="35" rx="12" fill="url(#crmGrad)"/>
    <rect x="0" y="25" width="195" height="10" fill="url(#crmGrad)"/>
    <text x="97" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">4. SALESFORCE CRM</text>

    <!-- Records -->
    <rect x="15" y="48" width="165" height="22" rx="4" fill="#f0f9ff"/>
    <text x="97" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">👤 Lead Records</text>

    <rect x="15" y="76" width="165" height="22" rx="4" fill="#f0f9ff"/>
    <text x="97" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">👥 Contact (+ Account Map)</text>

    <rect x="15" y="104" width="165" height="22" rx="4" fill="#f0f9ff"/>
    <text x="97" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">🏢 Account Records</text>
  </g>
</svg>
