<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background and Theme Gradients -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032d60"/>
      <stop offset="50%" stop-color="#0176d3"/>
      <stop offset="100%" stop-color="#0b5cab"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="floatingCardShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Canvas Container -->
  <rect x="2" y="2" width="796" height="476" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- Salesforce Lightning Experience Top Navigation Bar -->
  <rect x="2" y="2" width="796" height="50" rx="12" fill="#ffffff"/>
  <rect x="2" y="38" width="796" height="14" fill="#ffffff"/>
  <line x1="2" y1="52" x2="798" y2="52" stroke="#e2e8f0" stroke-width="1"/>

  <!-- App Launcher 9-Dots Icon -->
  <g transform="translate(18, 16)">
    <rect x="0" y="0" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="7" y="0" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="14" y="0" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="0" y="7" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="7" y="7" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="14" y="7" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="0" y="14" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="7" y="14" width="5" height="5" rx="1" fill="#0176d3"/>
    <rect x="14" y="14" width="5" height="5" rx="1" fill="#0176d3"/>
  </g>

  <!-- Salesforce Cloud Brand & App Title -->
  <g transform="translate(48, 14)">
    <path d="M12 4C9.5 4 7.4 5.7 6.8 8C5.2 8.3 4 9.7 4 11.5C4 13.4 5.6 15 7.5 15H17.5C19.4 15 21 13.4 21 11.5C21 9.8 19.8 8.4 18.2 8.1C17.7 5.7 15.6 4 13 4H12Z" fill="#00a1e0"/>
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#032d60">Business Card Scanner</text>
  </g>

  <!-- Nav Tabs -->
  <g transform="translate(245, 17)">
    <rect x="0" y="-3" width="90" height="26" rx="4" fill="#f1f5f9"/>
    <text x="45" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0176d3" text-anchor="middle">Scanner</text>
    <text x="125" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Leads</text>
    <text x="185" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Contacts</text>
    <text x="255" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Accounts</text>
  </g>

  <!-- Global Status Badge & Settings Gear -->
  <g transform="translate(620, 15)">
    <!-- Trial Status Pill -->
    <rect x="0" y="0" width="115" height="24" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <circle cx="10" cy="12" r="3.5" fill="#10b981"/>
    <text x="62" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Trial Active (Org)</text>
    <!-- Gear Icon -->
    <circle cx="138" cy="12" r="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M138 6.5C135 6.5 132.5 9 132.5 12C132.5 15 135 17.5 138 17.5C141 17.5 143.5 15 143.5 12C143.5 9 141 6.5 138 6.5ZM138 14.5C136.6 14.5 135.5 13.4 135.5 12C135.5 10.6 136.6 9.5 138 9.5C139.4 9.5 140.5 10.6 140.5 12C140.5 13.4 139.4 14.5 138 14.5Z" fill="#64748b"/>
  </g>

  <!-- Main Hero Card Body -->
  <g transform="translate(18, 68)">
    <!-- Blue Gradient Background Container -->
    <rect x="0" y="0" width="764" height="392" rx="14" fill="url(#heroGradient)"/>

    <!-- Subtle Ambient Background Blobs -->
    <circle cx="700" cy="80" r="140" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="50" cy="340" r="100" fill="#ffffff" fill-opacity="0.03"/>

    <!-- LEFT COLUMN: Value Proposition & Controls -->
    <g transform="translate(36, 42)">
      <!-- Multimodal Pill -->
      <rect x="0" y="0" width="186" height="24" rx="12" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
      <text x="93" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">✨ GOOGLE GEMINI VISION AI</text>

      <!-- Main Headline -->
      <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Instant Business Card</text>
      <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#93c5fd" letter-spacing="-0.5">To Salesforce Records</text>

      <!-- Subtext -->
      <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#e0f2fe">Snap physical cards with your camera or mobile gallery.</text>
      <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#e0f2fe">Multimodal AI extracts names, emails, phones, and addresses</text>
      <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#e0f2fe">directly into Leads, Contacts, or Accounts in 2 seconds.</text>

      <!-- Primary Action: Take Photo Button -->
      <g transform="translate(0, 206)" filter="url(#btnShadow)">
        <rect x="0" y="0" width="160" height="46" rx="8" fill="#ffffff"/>
        <!-- Camera Icon -->
        <path d="M22 17C21.6 17 21.2 17.15 20.9 17.4L19.8 18.5H17.5C16.7 18.5 16 19.2 16 20V29C16 29.8 16.7 30.5 17.5 30.5H30.5C31.3 30.5 32 29.8 32 29V20C32 19.2 31.3 18.5 30.5 18.5H28.2L27.1 17.4C26.8 17.15 26.4 17 26 17H22ZM24 28C21.8 28 20 26.2 20 24C20 21.8 21.8 20 24 20C26.2 20 28 21.8 28 24C28 26.2 26.2 28 24 28ZM29.5 21.5C29.5 22.05 29.05 22.5 28.5 22.5C27.95 22.5 27.5 22.05 27.5 21.5C27.5 20.95 27.95 20.5 28.5 20.5C29.05 20.5 29.5 20.95 29.5 21.5Z" fill="#0176d3" transform="translate(2, 0)"/>
        <text x="88" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#0176d3" text-anchor="middle">Take Photo</text>
      </g>

      <!-- Secondary Action: Gallery Upload Button -->
      <g transform="translate(175, 206)">
        <rect x="0" y="0" width="165" height="46" rx="8" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4"/>
        <!-- Gallery/Image Icon -->
        <path d="M22 17H32C33.1 17 34 17.9 34 19V27C34 28.1 33.1 29 32 29H22C20.9 29 20 28.1 20 27V19C20 17.9 20.9 17 22 17ZM32 27V19H22V27H32ZM23.5 25.5L25.5 22.8L27 24.8L29 22L31.5 25.5H23.5Z" fill="#ffffff" transform="translate(-2, 0)"/>
        <text x="96" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Upload Gallery</text>
      </g>

      <!-- Capability Feature Tags -->
      <g transform="translate(0, 282)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#bfdbfe">⚡ 2-Second OCR Speed</text>
        <text x="145" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#bfdbfe">🌐 100+ Languages</text>
        <text x="270" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#bfdbfe">📱 Mobile &amp; Desktop</text>
      </g>
    </g>

    <!-- RIGHT COLUMN: Interactive Camera Viewfinder & Scanned Card -->
    <g transform="translate(425, 34)">
      <!-- Camera Viewfinder Outer Box -->
      <rect x="0" y="0" width="308" height="324" rx="12" fill="#021d3f" fill-opacity="0.55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3"/>

      <!-- Viewfinder Target Corner Brackets -->
      <!-- Top-Left -->
      <path d="M16 32V20C16 17.8 17.8 16 20 16H32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Top-Right -->
      <path d="M292 32V20C292 17.8 290.2 16 288 16H276" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Bottom-Left -->
      <path d="M16 292V304C16 306.2 17.8 308 20 308H32" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- Bottom-Right -->
      <path d="M292 292V304C292 306.2 290.2 308 288 308H276" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Center Floating Realistic Scanned Business Card -->
      <g transform="translate(24, 46)" filter="url(#floatingCardShadow)">
        <!-- Card Body -->
        <rect x="0" y="0" width="260" height="162" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1"/>
        
        <!-- Top Colored Brand Accent Stripe -->
        <rect x="0" y="0" width="260" height="6" rx="3" fill="#0176d3"/>

        <!-- Company Logo & Name -->
        <circle cx="28" cy="30" r="11" fill="#0176d3"/>
        <path d="M23 30L27 34L33 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
        <text x="46" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0f172a">CLOUDSCALE DYNAMICS</text>
        <text x="46" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="600" fill="#64748b">ENTERPRISE SOFTWARE</text>

        <!-- Person Name & Title -->
        <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Sarah Jenkins</text>
        <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0176d3">VP of Enterprise Sales</text>

        <!-- Extracted Details with SLDS icons -->
        <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#334155">✉️ sarah.jenkins@cloudscale.io</text>
        <text x="20" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#334155">📞 +1 (415) 890-2341</text>
        <text x="20" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#334155">📍 500 Howard St, San Francisco, CA</text>

        <!-- AI Semantic Detection Tags (Green Bounding Boxes) -->
        <!-- Name Box -->
        <rect x="15" y="60" width="105" height="34" rx="4" fill="none" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3 2"/>
        <rect x="104" y="58" width="34" height="12" rx="3" fill="#10b981"/>
        <text x="121" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="#ffffff" text-anchor="middle">NAME</text>

        <!-- Email Box -->
        <rect x="15" y="102" width="165" height="14" rx="3" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 2"/>
      </g>

      <!-- Laser Scanning Beam Effect -->
      <rect x="24" y="110" width="260" height="35" fill="url(#scanBeam)"/>
      <line x1="24" y1="145" x2="284" y2="145" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Live AI Detection Status Pill -->
      <g transform="translate(64, 252)">
        <rect x="0" y="0" width="180" height="30" rx="15" fill="#032d60" stroke="#38bdf8" stroke-width="1.2"/>
        <circle cx="16" cy="15" r="4" fill="#10b981"/>
        <text x="96" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">AI Analyzing Fields... 99.4%</text>
      </g>
    </g>
  </g>
</svg>