<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Lighting and gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032d60"/>
      <stop offset="60%" stop-color="#0070d2"/>
      <stop offset="100%" stop-color="#1589ee"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="glassBtn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#032d60" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser/App Frame -->
  <rect x="10" y="10" width="780" height="460" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Browser Chrome Top Bar -->
  <rect x="10" y="10" width="780" height="40" rx="14" fill="#ffffff"/>
  <rect x="10" y="38" width="780" height="12" fill="#ffffff"/>
  <circle cx="34" cy="30" r="5" fill="#ef4444"/>
  <circle cx="50" cy="30" r="5" fill="#f59e0b"/>
  <circle cx="66" cy="30" r="5" fill="#10b981"/>
  <!-- App Title in Browser Bar -->
  <rect x="220" y="20" width="360" height="20" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="400" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">⚡ Salesforce Lightning — Business Card Scanner</text>

  <!-- Main Hero Card Container -->
  <g filter="url(#shadow)">
    <rect x="50" y="70" width="700" height="370" rx="16" fill="url(#headerGrad)"/>
  </g>

  <!-- Decorative Background Bubbles -->
  <circle cx="100" cy="110" r="80" fill="#ffffff" fill-opacity="0.05"/>
  <circle cx="700" cy="380" r="100" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Left: Interactive Scanner Hero Display -->
  <!-- Pulsing Scanner Ring -->
  <circle cx="210" cy="180" r="48" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="210" cy="180" r="38" fill="#ffffff" fill-opacity="0.08"/>
  <!-- Scanner Icon -->
  <path d="M196 172V166C196 163.791 197.791 162 200 162H206M214 162H220C222.209 162 224 163.791 224 166V172M224 188V194C224 196.209 222.209 198 220 198H214M206 198H200C197.791 198 196 196.209 196 194V188" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Laser Scan Line -->
  <line x1="175" y1="180" x2="245" y2="180" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hero Titles -->
  <text x="210" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Business Card Scanner</text>
  <text x="210" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#e0f2fe" text-anchor="middle">Snap or upload a card — Gemini AI extracts contacts instantly</text>

  <!-- Action CTA Buttons -->
  <!-- Take Photo Button -->
  <g transform="translate(100, 316)">
    <rect x="0" y="0" width="135" height="42" rx="10" fill="url(#glassBtn)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Traditional Camera SVG Icon -->
    <path d="M22 17C21.6 17 21.2 17.15 20.9 17.4L19.8 18.5H17.5C16.7 18.5 16 19.2 16 20V29C16 29.8 16.7 30.5 17.5 30.5H30.5C31.3 30.5 32 29.8 32 29V20C32 19.2 31.3 18.5 30.5 18.5H28.2L27.1 17.4C26.8 17.15 26.4 17 26 17H22ZM24 28C21.8 28 20 26.2 20 24C20 21.8 21.8 20 24 20C26.2 20 28 21.8 28 24C28 26.2 26.2 28 24 28ZM29.5 21.5C29.5 22.05 29.05 22.5 28.5 22.5C27.95 22.5 27.5 22.05 27.5 21.5C27.5 20.95 27.95 20.5 28.5 20.5C29.05 20.5 29.5 20.95 29.5 21.5Z" fill="#ffffff" transform="translate(-4, -6)"/>
    <text x="68" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Take Photo</text>
  </g>

  <!-- Choose from Gallery Button -->
  <g transform="translate(250, 316)">
    <rect x="0" y="0" width="165" height="42" rx="10" fill="url(#glassBtn)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.45"/>
    <path d="M22 18H32C33.1 18 34 18.9 34 20V28C34 29.1 33.1 30 32 30H22C20.9 30 20 29.1 20 28V20C20 18.9 20.9 18 22 18ZM32 28V20H22V28H32ZM23.5 26.5L25.5 23.8L27 25.8L29 23L31.5 26.5H23.5Z" fill="#ffffff" transform="translate(-2, -3)"/>
    <text x="94" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Choose from Gallery</text>
  </g>

  <!-- Right: Realistic 3D Business Card Mockup being scanned -->
  <g transform="translate(460, 130)" filter="url(#cardShadow)">
    <!-- Business Card Body -->
    <rect x="0" y="0" width="240" height="150" rx="10" fill="url(#cardBg)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Card Company Color Header -->
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#0284c7"/>
    <!-- Mock Logo -->
    <circle cx="30" cy="35" r="12" fill="#0284c7"/>
    <path d="M25 35L29 39L36 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0f172a">APEX INNOVATORS</text>
    <text x="50" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748b">GLOBAL CLOUD SOLUTIONS</text>
    
    <!-- Mock Person Details -->
    <text x="20" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#0f172a">Sarah Jenkins</text>
    <text x="20" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#0284c7">VP of Enterprise Sales</text>

    <!-- Mock Contact details with icons -->
    <text x="20" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#475569">📧 sarah.jenkins@apexinnovators.com</text>
    <text x="20" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#475569">📞 +1 (415) 890-2341</text>
    <text x="20" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500" fill="#475569">🌐 www.apexinnovators.com</text>

    <!-- Animated AI Bounding Boxes overlaying card -->
    <rect x="16" y="66" width="115" height="32" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2"/>
    <rect x="120" y="66" width="36" height="12" rx="3" fill="#10b981"/>
    <text x="138" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">NAME</text>

    <rect x="16" y="104" width="195" height="15" rx="3" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 2"/>
  </g>

  <!-- AI Gemini Badge -->
  <g transform="translate(490, 310)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="20" cy="18" r="8" fill="#38bdf8"/>
    <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#032d60" text-anchor="middle">AI</text>
    <text x="96" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Google Gemini Vision</text>
  </g>
</svg>
